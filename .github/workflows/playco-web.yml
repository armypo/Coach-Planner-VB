# Site d'analyse IA de volleyball (web/) — voir web/README.md.
# - tests : moteur (détection image + son, métriques, API) sur des vidéos
#   générées ; IA factice, aucun appel réseau.
# - youtube : essai RÉEL sur un lien YouTube (le conteneur de dev n'a pas
#   accès à YouTube). Déclenché à la main (Run workflow, avec l'IA si le
#   secret ANTHROPIC_API_KEY existe) ou quand web/essais/youtube.txt change
#   (signal seul, aucun coût IA).
name: PlaycoWeb

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/playco-web.yml'
  workflow_dispatch:
    inputs:
      url:
        description: 'Lien YouTube à analyser'
        required: true
      ia:
        description: 'Analyse IA (Claude, secret ANTHROPIC_API_KEY) ou signal seul'
        type: choice
        options: [claude, aucune]
        default: claude
      echanges_ia_max:
        description: "Plafond d'échanges envoyés à l'IA (vide = tous)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: playco-web-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (web)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: web/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  youtube:
    name: analyse d'un vrai lien YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Liens à analyser
        id: liens
        env:
          URL_MANUELLE: ${{ github.event.inputs.url }}
          AVANT: ${{ github.event.before }}
        run: |
          if [ -n "$URL_MANUELLE" ]; then
            printf '%s\n' "$URL_MANUELLE" > ../liens.txt
          elif [ -n "$AVANT" ] && git cat-file -e "$AVANT" 2>/dev/null \
               && git diff --name-only "$AVANT" "$GITHUB_SHA" | grep -qx 'web/essais/youtube.txt'; then
            grep -vE '^\s*(#|$)' essais/youtube.txt > ../liens.txt || true
          else
            : > ../liens.txt
          fi
          echo "nombre=$(wc -l < ../liens.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat ../liens.txt
      - uses: actions/setup-python@v6
        if: steps.liens.outputs.nombre != '0'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: web/requirements*.txt
      - if: steps.liens.outputs.nombre != '0'
        run: pip install -r requirements.txt
      - name: Analyse
        if: steps.liens.outputs.nombre != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAYCO_IA: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.ia == 'claude') && 'auto' || 'aucune' }}
          PLAFOND: ${{ github.event.inputs.echanges_ia_max }}
        run: |
          mkdir -p ../rapports
          n=0
          while IFS= read -r lien; do
            n=$((n + 1))
            python -m playco_web "$lien" -o "../rapports/rapport-$n.json" ${PLAFOND:+--echanges-ia-max "$PLAFOND"}
            python -m playco_web.resume "../rapports/rapport-$n.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done < ../liens.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.liens.outputs.nombre != '0'
        with:
          name: rapports-youtube
          path: rapports/
          if-no-files-found: ignore
